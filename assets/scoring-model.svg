<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc"><title id="title">Explainable lead score</title><desc id="desc">Website need 50 percent, ability to spend 25 percent, business activity 15 percent, contactability 10 percent. Proposed weights, not measured results.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcd0"/><stop offset="1" stop-color="#7756f5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6d87b7"/></marker></defs><rect width="1280" height="410" rx="24" fill="#0c1735"/><text x="50" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">EXPLAINABLE OPPORTUNITY SCORE</text><text x="50" y="104" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#c7d5ee" text-anchor="start">Four evidence dimensions. One inspectable priority score.</text><rect x="50" y="145" width="590.0" height="22" fill="#23cce0"/><rect x="640.0" y="145" width="295.0" height="22" fill="#7756f5"/><rect x="935.0" y="145" width="177.0" height="22" fill="#21b77a"/><rect x="1112.0" y="145" width="118.0" height="22" fill="#ecb248"/><text x="50" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#23cce0" text-anchor="start">50%</text><text x="50" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Website need</text><text x="50" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#b9c9e4" text-anchor="start">Observed quality gap</text><text x="350" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#7756f5" text-anchor="start">25%</text><text x="350" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Ability to spend</text><text x="350" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#b9c9e4" text-anchor="start">Public capacity signals</text><text x="650" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#21b77a" text-anchor="start">15%</text><text x="650" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Business activity</text><text x="650" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#b9c9e4" text-anchor="start">Contemporary operation</text><text x="950" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#ecb248" text-anchor="start">10%</text><text x="950" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Contactability</text><text x="950" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#b9c9e4" text-anchor="start">Credible contact routes</text><text x="50" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#b9c9e4" text-anchor="start">PROPOSED DEFAULTS / SCORES GUIDE REVIEW; THEY DO NOT AUTHORIZE SENDING</text></svg>