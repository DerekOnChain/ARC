9" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="299" width="6" height="89" rx="3" fill="#7756f5"/><text x="440" y="333" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">02 / Normalize and screen</text><text x="440" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Identity, exclusions, duplicates, activity</text><rect x="30" y="433" width="315" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="30" y="433" width="6" height="99" rx="3" fill="#d89722"/><text x="50" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">Exclude or hold</text><text x="50" y="492" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Record the reason; unknown</text><text x="50" y="512" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">is not confirmed closure</text><rect x="420" y="433" width="400" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="433" width="6" height="99" rx="3" fill="#7756f5"/><text x="440" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">03 / Collect evidence</text><text x="440" y="492" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Website, business and contact signals</text><rect x="920" y="433" width="330" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="920" y="433" width="6" height="99" rx="3" fill="#d89722"/><text x="940" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">Pause + cost gates</text><text x="940" y="492" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Bounded research; reserve</text><text x="940" y="512" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">paid usage before calls</text><rect x="420" y="577" width="400" height="89" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="577" width="6" height="89" rx="3" fill="#7756f5"/><text x="440" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">04 / Explainable ranking</text><text x="440" y="636" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Need 50 / Spend 25 / Activity 15 / Contact 10</text><rect x="420" y="711" width="400" height="89" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="711" width="6" height="89" rx="3" fill="#7756f5"/><text x="440" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">05 / Owner selects lead</text><text x="440" y="770" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Private findings report + email draft</text><rect x="420" y="845" width="400" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="845" width="6" height="99" rx="3" fill="#d89722"/><text x="440" y="879" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">Approval gate</text><text x="440" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Exact recipient and content;</text><text x="440" y="924" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">edits invalidate approval</text><rect x="420" y="989" width="400" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="420" y="989" width="6" height="99" rx="3" fill="#21b77a"/><text x="440" y="1023" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">06 / Controlled action</text><text x="440" y="1048" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Final pause + suppression checks</text><text x="440" y="1068" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Send only when separately enabled</text><rect x="920" y="989" width="330" height="99" rx="14" fill="#fff" stroke="#dce3f0" stroke-width="2"/><rect x="920" y="989" width="6" height="99" rx="3" fill="#21b77a"/><text x="940" y="1023" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c1735" text-anchor="start">Outcome feedback</text><text x="940" y="1048" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Replies, proposals, wins</text><text x="940" y="1068" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#55637d" text-anchor="start">Human-reviewed calibration</text><text x="52" y="1137" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#55637d" text-anchor="start">PROPOSED WORKFLOW / FOUNDATION CONFIGURED PAUSED</text></svg>